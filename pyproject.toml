[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powerbench-inference"
version = "0.1.0"
description = "Reproducible heterogeneous-hardware benchmarking for time-series foundation models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.0",
    "psutil>=5.9",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8", "scipy>=1.10"]
test = ["pytest>=8.0,<9.0", "ruff>=0.8,<1.0"]

[project.scripts]
powerbench = "powerbench.cli:main"
powerbench-forecast = "experiments.forecasting:main"
powerbench-ttm-routes = "scripts.inspect_ttm_r3_variants:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "powerbench*",
    "analysis*",
    "benchmark*",
    "experiments*",
    "models*",
    "scripts*",
    "utils*",
]
exclude = ["tests*", "dataset*"]
namespaces = true

[tool.setuptools.package-data]
"utils.tempopfn" = [
    "configs/*.yaml",
    "data/*.json",
    "models/*.md",
    "src/models/gated_deltaproduct/*.md",
]

[tool.ruff]
line-length = 100
exclude = ["utils/kairos", "utils/tempopfn", "utils/toto", "utils/uni2ts", "utils/units"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"experiments/forecasting.py" = ["E402"]
"models/flowstate.py" = ["E402"]
"models/kairos.py" = ["E402"]
"models/tempopfn.py" = ["E402"]
"models/tempopfn_cpu.py" = ["E402"]
"models/toto.py" = ["E402"]
"models/ttm.py" = ["E402"]
"models/units.py" = ["E402"]
